}
</style><rect class="bg" x="0.5" y="0.5" width="419" height="287" rx="8"/><text class="t" x="24" y="44" font-size="18" font-weight="600">Stripe ↔ Salesforce</text><rect class="bd" x="264" y="29" width="132" height="22" rx="11"/><text class="m" x="330" y="44" font-size="12" text-anchor="middle">Sandbox · Phase 0</text><text class="t" x="24" y="79" font-size="14">Card payments close the right NPSP donation, and</text><text class="t" x="24" y="100" font-size="14">donors get the right thank-you email</text><text class="t" x="24" y="121" font-size="14">automatically. A backstop matches each payment by</text><text class="t" x="24" y="142" font-size="14">Stripe ID, then recurring donation, then email and</text><text class="t" x="24" y="163" font-size="14">amount. An LWC console switches each of 13 email</text><text class="t" x="24" y="184" font-size="14">types between Live, Test and Off.</text><text class="m" x="24" y="210" font-size="12.5">26/26 Apex tests at 89–92% coverage · 11/11 Jest tests ·</text><text class="m" x="24" y="228" font-size="12.5">every PR test-deployed in CI</text><rect class="pill" x="24" y="242" width="48" height="22" rx="11"/><text class="pt" x="48" y="257" font-size="12" text-anchor="middle">Apex</text><rect class="pill" x="78" y="242" width="41" height="22" rx="11"/><text class="pt" x="98" y="257" font-size="12" text-anchor="middle">LWC</text><rect class="pill" x="125" y="242" width="62" height="22" rx="11"/><text class="pt" x="156" y="257" font-size="12" text-anchor="middle">Stripe</text><rect class="pill" x="192" y="242" width="48" height="22" rx="11"/><text class="pt" x="216" y="257" font-size="12" text-anchor="middle">NPSP</text></svg>