<svg xmlns="http://www.w3.org/2000/svg" width="860" height="283" viewBox="0 0 860 283" role="img" aria-label="I build the systems behind the money: payments, Salesforce, finance systems, automation and AI."><style>
.bg{fill:#ffffff;stroke:#d0d7de} .t{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif} .m{fill:#59636e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.pill{fill:#ddf4ff} .pt{fill:#0550ae;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif} .bd{fill:none;stroke:#d0d7de} .ac{fill:#0969da;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.tile{fill:#f6f8fa;stroke:#d0d7de}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d} .t{fill:#e6edf3} .m{fill:#9198a1} .pill{fill:#132339} .pt{fill:#79c0ff}
.bd{stroke:#3d444d} .ac{fill:#4493f8} .tile{fill:#151b23;stroke:#30363d}
}
</style><rect class="bg" x="0.5" y="0.5" width="859" height="282" rx="8"/><text class="t" x="32" y="64" font-size="32" font-weight="700">I build the systems behind the money.</text><text class="t" x="32" y="99" font-size="15.5">Loan books, payment approvals, donor payments, Salesforce automation, and the websites people</text><text class="t" x="32" y="124" font-size="15.5">find you through. I build software for organisations that need it to be careful with money, keep</text><text class="t" x="32" y="149" font-size="15.5">a record of every change, and be easy for non-technical staff to use.</text><rect class="tile" x="32" y="177" width="190" height="74" rx="6"/><text class="t" x="48" y="211" font-size="19" font-weight="700">Payments</text><text class="m" x="48" y="233" font-size="11.5">M-Pesa · Stripe · Flutterwave</text><rect class="tile" x="234" y="177" width="190" height="74" rx="6"/><text class="t" x="250" y="211" font-size="19" font-weight="700">Salesforce</text><text class="m" x="250" y="233" font-size="11.5">NPSP · Apex · LWC · Flow</text><rect class="tile" x="436" y="177" width="190" height="74" rx="6"/><text class="t" x="452" y="211" font-size="19" font-weight="700">Finance systems</text><text class="m" x="452" y="233" font-size="11.5">Loans · approvals · expenses</text><rect class="tile" x="638" y="177" width="190" height="74" rx="6"/><text class="t" x="654" y="211" font-size="19" font-weight="700">Automation &amp; AI</text><text class="m" x="654" y="233" font-size="11.5">Meetings into tracked work</text></svg>