.bg{fill:#0d1117;stroke:#30363d} .t{fill:#e6edf3} .m{fill:#9198a1} .pill{fill:#132339} .pt{fill:#79c0ff}
.bd{stroke:#3d444d} .ac{fill:#4493f8} .tile{fill:#151b23;stroke:#30363d}
}
</style><rect class="bg" x="0.5" y="0.5" width="419" height="287" rx="8"/><text class="t" x="24" y="44" font-size="18" font-weight="600">Staff Attendance &amp; Portal</text><rect class="bd" x="284" y="29" width="112" height="22" rx="11"/><text class="m" x="340" y="44" font-size="12" text-anchor="middle">Sandbox-tested</text><text class="t" x="24" y="79" font-size="14">Check in and out with location checks against the</text><text class="t" x="24" y="100" font-size="14">office radius. Staff without a Salesforce login</text><text class="t" x="24" y="121" font-size="14">sign in with an emailed code. Corrections need</text><text class="t" x="24" y="142" font-size="14">admin approval, and saved days are locked.</text><text class="t" x="24" y="163" font-size="14">Reminders, weekly summaries, and public holidays</text><text class="t" x="24" y="184" font-size="14">filled in automatically each year.</text><rect class="pill" x="24" y="198" width="48" height="22" rx="11"/><text class="pt" x="48" y="213" font-size="12" text-anchor="middle">Apex</text><rect class="pill" x="78" y="198" width="41" height="22" rx="11"/><text class="pt" x="98" y="213" font-size="12" text-anchor="middle">LWC</text><rect class="pill" x="125" y="198" width="131" height="22" rx="11"/><text class="pt" x="190" y="213" font-size="12" text-anchor="middle">Visualforce site</text><rect class="pill" x="262" y="198" width="117" height="22" rx="11"/><text class="pt" x="321" y="213" font-size="12" text-anchor="middle">Scheduled jobs</text></svg>