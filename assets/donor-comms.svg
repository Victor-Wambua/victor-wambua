<svg xmlns="http://www.w3.org/2000/svg" width="420" height="223" viewBox="0 0 420 223" role="img" aria-label="Sponsor &amp; donor emails: A reusable bulk email flow for sponsors, with test mode and a preview before sending. Also campaign and single-record emails, scheduled sends, branded unsubscribe pages and a history of each correspondence's status."><style>
