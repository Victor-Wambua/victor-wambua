<svg xmlns="http://www.w3.org/2000/svg" width="860" height="379" viewBox="0 0 860 379" role="img" aria-label="WorkTrail: from meeting promises to verified delivery."><style>
.bg{fill:#ffffff;stroke:#d0d7de} .t{fill:#1f2328;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif} .m{fill:#59636e;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.pill{fill:#ddf4ff} .pt{fill:#0550ae;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif} .bd{fill:none;stroke:#d0d7de} .ac{fill:#0969da;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif}
.tile{fill:#f6f8fa;stroke:#d0d7de}
@media (prefers-color-scheme: dark){
.bg{fill:#0d1117;stroke:#30363d} .t{fill:#e6edf3} .m{fill:#9198a1} .pill{fill:#132339} .pt{fill:#79c0ff}
.bd{stroke:#3d444d} .ac{fill:#4493f8} .tile{fill:#151b23;stroke:#30363d}
}
</style><rect class="bg" x="0.5" y="0.5" width="859" height="378" rx="8"/><text class="t" x="28" y="48" font-size="20" font-weight="600">WorkTrail: from meeting promises to verified delivery</text><rect class="bd" x="692" y="31" width="140" height="24" rx="12"/><text class="m" x="762.0" y="48" font-size="12" text-anchor="middle">Private · Working build</text><text class="t" x="28" y="71" font-size="14.5">Local-first work intelligence. It began as a meeting recorder and became the system that tracks whether</text><text class="t" x="28" y="94" font-size="14.5">promised work actually got done: it records meetings, pulls out actions and decisions, then watches six</text><text class="t" x="28" y="117" font-size="14.5">work tools for proof that each item was done.</text><text class="t" x="28" y="155" font-size="14" font-weight="600">Records</text><text class="m" x="28" y="175" font-size="13">Two-track capture with no meeting</text><text class="m" x="28" y="193" font-size="13">bot; offline, on-device</text><text class="m" x="28" y="211" font-size="13">transcription.</text><text class="t" x="300" y="155" font-size="14" font-weight="600">Checks for proof</text><text class="m" x="300" y="175" font-size="13">Matches promises to PRs, to-dos,</text><text class="m" x="300" y="193" font-size="13">Slack threads, emails and Salesforce</text><text class="m" x="300" y="211" font-size="13">changes.</text><text class="t" x="572" y="155" font-size="14" font-weight="600">Drafts</text><text class="m" x="572" y="175" font-size="13">Agendas, follow-ups and a cited</text><text class="m" x="572" y="193" font-size="13">monthly report; anything unbacked</text><text class="m" x="572" y="211" font-size="13">goes under “To confirm”.</text><text class="t" x="28" y="247" font-size="14" font-weight="600">Asks before it acts</text><text class="m" x="28" y="267" font-size="13">Emails, calendar events, issues and</text><text class="m" x="28" y="285" font-size="13">to-dos wait for approval. Nothing is</text><text class="m" x="28" y="303" font-size="13">sent alone.</text><text class="t" x="300" y="247" font-size="14" font-weight="600">Watches Salesforce</text><text class="m" x="300" y="267" font-size="13">Flags idle admins, outside sign-ins,</text><text class="m" x="300" y="285" font-size="13">overdue pledges and failing</text><text class="m" x="300" y="303" font-size="13">automations.</text><text class="t" x="572" y="247" font-size="14" font-weight="600">Works across machines</text><text class="m" x="572" y="267" font-size="13">A two-way link pulls the work log</text><text class="m" x="572" y="285" font-size="13">from a second Mac running AI</text><text class="m" x="572" y="303" font-size="13">sessions.</text><rect class="pill" x="28" y="329" width="62" height="22" rx="11"/><text class="pt" x="59" y="344" font-size="12" text-anchor="middle">Python</text><rect class="pill" x="96" y="329" width="69" height="22" rx="11"/><text class="pt" x="130" y="344" font-size="12" text-anchor="middle">FastAPI</text><rect class="pill" x="170" y="329" width="62" height="22" rx="11"/><text class="pt" x="201" y="344" font-size="12" text-anchor="middle">SQLite</text><rect class="pill" x="238" y="329" width="222" height="22" rx="11"/><text class="pt" x="349" y="344" font-size="12" text-anchor="middle">On-device transcription (MLX)</text><rect class="pill" x="466" y="329" width="90" height="22" rx="11"/><text class="pt" x="511" y="344" font-size="12" text-anchor="middle">Claude API</text><rect class="pill" x="562" y="329" width="104" height="22" rx="11"/><text class="pt" x="613" y="344" font-size="12" text-anchor="middle">6 connectors</text></svg>